<text x="656" y="747" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">AXI4</text>
<rect x="1180" y="755" width="165" height="56" rx="0" fill="#ffffff" stroke="#2F5597" stroke-width="1.2"/>
<text x="1262.5" y="773.7" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">DDR4 SDRAM (board)</text>
<text x="1262.5" y="786.6" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal">BUF0 at 0x0000_0000</text>
<text x="1262.5" y="799.1" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal">BUF1 at 0x1000_0000</text>
<path d="M 742.0,783.0 L 1178.0,783.0" fill="none" stroke="#2F5597" stroke-width="1.2" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="900" y="777" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">DDR4</text>
<text x="1180" y="150" font-size="11" text-anchor="start" font-weight="bold" font-style="normal">How the PCIe variant runs</text>
<text x="1180" y="168" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">1. The host writes the seed into</text>
<text x="1180" y="182" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">BUF0 by H2C DMA.</text>
<text x="1180" y="196" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">2. Through BAR 0 it sets RUN and</text>
<text x="1180" y="210" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">writes FRAME_REQ (the doorbell).</text>
<text x="1180" y="224" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">3. Each pass reads the front</text>
<text x="1180" y="238" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">buffer and writes the back buffer;</text>
<text x="1180" y="252" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">pass_done can raise an interrupt</text>
<text x="1180" y="266" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">(or the host polls STATUS).</text>
<text x="1180" y="280" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">4. The host reads the newest</text>
<text x="1180" y="294" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">generation by C2H DMA.</text>
<line x1="40" y1="846" x2="1320" y2="846" stroke="#2F5597" stroke-width="0.6"/>
<rect x="40" y="857" width="22" height="12" rx="0" fill="#ffffff" stroke="#2F5597" stroke-width="1.2"/>
<text x="68" y="867" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">aclk: AXI side</text>
<rect x="172" y="857" width="22" height="12" rx="0" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.2"/>
<text x="200" y="867" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">eclk: engine</text>
<rect x="293" y="857" width="22" height="12" rx="0" fill="url(#cdc_e)" stroke="#2F5597" stroke-width="1.2"/>
<text x="321" y="867" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">clock-domain crossing (async FIFO, dual-clock RAM, toggle handshake)</text>
<text x="40" y="890" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">Solid arrows: data (AXI4, AXI4-Lite, AXI4-Stream and the external links); dashed: control and configuration.</text>
<text x="700" y="890" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">One pass: front buffer → frame reader → line buffer → window → rule → packer → FIFO → frame writer → back buffer.</text>
</g></svg>
