<text x="650.0" y="786.6" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal">from board automation</text>
<text x="650.0" y="799.1" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal">own user clock</text>
